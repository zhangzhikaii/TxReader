<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TxReader</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
          --accent:#07c160; --income:#fff7e6; --warn:#fde8e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); }
  .layout { display:flex; align-items:flex-start; }
  main { flex:1; min-width:0; max-width:1000px; margin:0 auto; padding:24px 16px; }
  /* Screenshot viewer: a column pinned to the right edge, as wide as the screenshot shown at full
     height (capped so the table keeps its room). The page content stays centred in the space left. */
  #viewer { display:none; flex:0 0 auto; position:sticky; top:0; height:100vh;
            overflow-y:auto; background:var(--card); border-left:1px solid var(--line); padding:0 12px 12px; }
  body.viewing #viewer { display:block; }
  /* width:0 + min-width:100%: a long file name must not widen the panel beyond the image */
  .viewer-bar { width:0; min-width:100%; position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; gap:8px;
                padding:12px 0 8px; background:var(--card); font-size:13px; color:var(--muted); }
  .viewer-bar span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Whole screenshot fits the window height (aspect ratio kept by the max-* limits) */
  #viewer-img { display:block; max-height:calc(100vh - 72px); width:auto; height:auto; max-width:min(32vw, 480px);
                margin:0 auto; border-radius:8px; border:1px solid var(--line); }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; }
  .thumbs:not(:empty) { margin-top:12px; }
  .thumb { position:relative; }
  .thumb-open { display:block; width:64px; height:112px; padding:0; background:none; border:2px solid var(--line);
                border-radius:6px; overflow:hidden; }
  .thumb-open:hover { border-color:var(--muted); }
  .thumb-open.active { border-color:var(--accent); }
  .thumb-open img { display:block; width:100%; height:100%; object-fit:cover; object-position:top; }
  .thumb-del { position:absolute; top:-6px; right:-6px; width:20px; height:20px; padding:0; border-radius:50%;
               background:#6b7280; color:#fff; font-size:13px; line-height:20px; text-align:center; }
  .thumb-del:hover { background:#dc2626; }
  /* Narrow screens: no room for two columns, so the viewer covers the page */
  @media (max-width:800px) {
    body.viewing #viewer { position:fixed; inset:0; height:auto; width:auto; z-index:10; border:0; }
    #viewer-img { max-width:100%; }
  }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .settings { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; color:var(--text); background:#fff; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:32px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  button { font:inherit; padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#e5e7eb; color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  #status { color:var(--muted); font-size:14px; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; white-space:nowrap; }
  /* Column widths sized so the table fits without sideways scrolling, also with the viewer open */
  td input { width:100%; min-width:72px; padding:4px 6px; }
  td.amt input { text-align:right; width:100px; font-variant-numeric:tabular-nums; }
  td.date input { width:160px; padding:4px; font-variant-numeric:tabular-nums; }
  td input[data-k="currency"] { width:60px; min-width:60px; }
  td input[data-k="merchant"] { min-width:180px; }
  td button { padding:4px 10px; }
  td input.guess { border-color:#f59e0b; background:#fffbeb; }
  td input.invalid { border-color:#dc2626; background:#fef2f2; }
  tr.income { background:var(--income); }
  tr.newday td { border-top:2px solid #6b7280; }
  tr.warn td.flag { color:#b91c1c; }
  .legend { font-size:13px; color:var(--muted); margin-top:8px; }
  .legend span { display:inline-block; width:12px; height:12px; vertical-align:middle; border:1px solid var(--line); background:var(--income); }
</style>
</head>
<body>
<div class="layout">
<main>
  <h1>TxReader · 截图记账</h1>

  <div class="card settings">
    <label>来源<select id="source">
      <option value="wechat">微信 · 零钱明细</option>
      <option value="boc">中国银行 · 交易明细</option>
      <option value="icbc">工商银行 · 收支明细</option>
      <option value="suica">Suica · Apple 钱包交易详情</option>
      <option value="receipt">小票 · 纸质收据照片</option>
    </select></label>
    <label>账户<input id="account" value="微信"></label>
    <label>币种<input id="currency" value="人民币"></label>
    <label>默认种类<input id="category" value="饮食费"></label>
    <label>年份（截图看不到年份时使用）<input id="year" type="number"></label>
    <label>日期排序<select id="order">
      <option value="asc">正序（旧 → 新）</option>
      <option value="desc">倒序（新 → 旧）</option>
    </select></label>
  </div>

  <div class="card">
    <div id="drop"></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="thumbs" class="thumbs"></div>
    <div class="bar"><span id="status"></span></div>
  </div>

  <div class="card" id="result" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日期</th><th>曜日</th><th>账户</th><th>币种</th><th>金额</th><th>种类</th><th>描述</th><th></th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="legend"><span></span> 收入（请确认种类）　⚠ 日期或正负号是推测的，请核对　日期格式 2026/10/29 22:12:00，可直接修改</div>
    <div class="bar">
      <button id="export">导出 CSV</button>
      <button id="clear" class="secondary">清空</button>
    </div>
  </div>
</main>

<aside id="viewer" aria-label="截图预览">
  <div class="viewer-bar"><span id="viewer-name"></span><button id="viewer-close" class="secondary">关闭</button></div>
  <img id="viewer-img" alt="">
</aside>
</div>

<script>
const $ = id => document.getElementById(id);
const SOURCES = {
  wechat: { hint: "点击或拖拽微信「零钱明细」列表截图到这里（可多张）",
            defaults: { account: "微信", currency: "人民币", category: "饮食费" } },
  boc:    { hint: "点击或拖拽中国银行单笔交易的「明细」页截图到这里（每张一笔，可多张）",
            defaults: { account: "中行", currency: "人民币", category: "饮食费" } },
  icbc:   { hint: "点击或拖拽工商银行「收支明细」列表截图到这里（可多张）",
            defaults: { account: "工行", currency: "人民币", category: "饮食费" } },
  suica:  { hint: "点击或拖拽 Apple 钱包里 Suica 单笔交易的详情页截图到这里（每张一笔，可多张）",
            defaults: { account: "Suica", currency: "日元", category: "交通费" } },
  receipt: { hint: "点击或拖拽小票照片到这里（每张一笔，可多张）。店名是尽力识别的，请对照大图核对",
            defaults: { account: "现金", currency: "日元", category: "饮食费" } },
};
const GLOBAL_SETTINGS = ["source", "year", "order"];
const SOURCE_SETTINGS = ["account", "currency", "category"]; // remembered separately per source
let records = [];
let nextId = 1; // stable row id, so focus survives re-sorting
let images = [];   // uploaded screenshots: { id, name, url }
let nextImgId = 1;
let viewing = null; // id of the screenshot shown in the viewer
let session = 0;    // bumped on clear / source switch, so results of uploads still in flight are dropped

const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

for (const k of GLOBAL_SETTINGS) {
  const v = load("tx." + k);
  if (v) $(k).value = v;
  $(k).addEventListener("change", () => save("tx." + k, $(k).value));
}
if (!$("year").value) $("year").value = new Date().getFullYear();

function applySource() {
  const src = $("source").value;
  for (const k of SOURCE_SETTINGS) {
    // "tx.<k>" is the pre-multi-source key, kept so existing WeChat settings carry over
    $(k).value = load(`tx.${src}.${k}`) ?? (src === "wechat" ? load("tx." + k) : null) ?? SOURCES[src].defaults[k];
  }
  $("drop").textContent = SOURCES[src].hint;
}
for (const k of SOURCE_SETTINGS) {
  $(k).addEventListener("change", () => save(`tx.${$("source").value}.${k}`, $(k).value));
}
// Rows and screenshots of one source don't belong with another's, so start over on switch
$("source").addEventListener("change", () => { clearAll(); applySource(); });
applySource();

function sortRecords() {
  const dir = $("order").value === "desc" ? -1 : 1;
  records.sort((a, b) => dir * a.date.localeCompare(b.date));
}
$("order").addEventListener("change", () => { sortRecords(); render(); });

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };
$("file").onchange = e => { upload(e.target.files); e.target.value = ""; };

async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) {
    fd.append("files", f);
    images.push({ id: nextImgId++, name: f.name, url: URL.createObjectURL(f) });
  }
  renderThumbs();
  fd.append("year", $("year").value);
  fd.append("source", $("source").value);
  $("status").textContent = `识别中（${files.length} 张）…`;
  const mySession = session;
  try {
    const res = await fetch("/api/parse", { method: "POST", body: fd });
    const data = await res.json();
    if (mySession !== session) return; // cleared or source switched while recognizing
    if (!res.ok) throw new Error(data.detail || res.statusText);
    const fresh = data.records.map(r => ({
      ...r, account: $("account").value, currency: $("currency").value, category: $("category").value,
    }));
    // Skip rows already in the table from an earlier upload
    const key = r => `${r.date}|${r.amount}|${r.merchant}|${r.balance}`;
    const have = new Set(records.map(key));
    const added = fresh.filter(r => !have.has(key(r))).map(r => ({ ...r, id: nextId++ }));
    records = records.concat(added);
    sortRecords();
    $("status").textContent = `识别到 ${fresh.length} 条，新增 ${added.length} 条` +
      (data.errors.length ? `；失败：${data.errors.join("；")}` : "");
    render();
  } catch (e) {
    if (mySession !== session) return;
    $("status").textContent = "出错了：" + e.message;
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const WEEKDAYS_JA = "日月火水木金土"; // indexed by Date.getDay()
const byId = id => records.find(r => r.id === +id);
const fmtAmount = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parseAmount = s => parseFloat(String(s).replace(/[,\s¥]/g, "")) || 0;

// Accepts 2026/10/29 22:12:00, 2026-10-29 22:12, 2026/10/29 ...; returns normalized string or null
function parseDate(s) {
  const m = s.trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (!m) return null;
  const [y, mo, d, h = 0, mi = 0, se = 0] = m.slice(1).map(v => v === undefined ? undefined : +v);
  const dt = new Date(y, mo - 1, d, h, mi, se);
  if (dt.getMonth() !== mo - 1 || dt.getDate() !== d || h > 23 || mi > 59 || se > 59) return null;
  const p = n => String(n).padStart(2, "0");
  return { date: `${y}/${p(mo)}/${p(d)} ${p(h)}:${p(mi)}:${p(se)}`, weekday: WEEKDAYS_JA[dt.getDay()] };
}

function render() {
  // Remember which cell had focus so it can be restored after rebuilding the table
  const active = document.activeElement?.dataset ?? {};
  $("result").hidden = records.length === 0;
  $("rows").innerHTML = records.map((r, i) => {
    const warn = r.year_guessed || r.sign_guessed;
    const tip = [r.year_guessed && "日期为推测", r.sign_guessed && "正负号为推测"].filter(Boolean).join("，");
    const newDay = i > 0 && r.date.slice(0, 10) !== records[i - 1].date.slice(0, 10);
    return `<tr class="${r.amount > 0 ? "income" : ""} ${warn ? "warn" : ""} ${newDay ? "newday" : ""}">
      <td class="date"><input data-id="${r.id}" data-k="date" value="${esc(r.date)}" class="${r.year_guessed ? "guess" : ""}" title="${r.year_guessed ? "日期为推测，请核对" : ""}"></td>
      <td>${esc(r.weekday)}</td>
      <td><input data-id="${r.id}" data-k="account" value="${esc(r.account)}"></td>
      <td><input data-id="${r.id}" data-k="currency" value="${esc(r.currency)}"></td>
      <td class="amt"><input data-id="${r.id}" data-k="amount" value="${fmtAmount(r.amount)}"></td>
      <td><input data-id="${r.id}" data-k="category" value="${esc(r.category)}"></td>
      <td><input data-id="${r.id}" data-k="merchant" value="${esc(r.merchant)}"></td>
      <td class="flag" title="${tip}">${warn ? "⚠" : ""}</td>
      <td><button class="secondary" data-del="${r.id}" tabindex="-1">删除</button></td></tr>`;
  }).join("");
  if (active.id && active.k) $("rows").querySelector(`input[data-id="${active.id}"][data-k="${active.k}"]`)?.focus();
}

$("rows").addEventListener("input", e => {
  const { id, k } = e.target.dataset;
  if (!id || k === "date") return; // dates are applied on change, once complete
  byId(id)[k] = k === "amount" ? parseAmount(e.target.value) : e.target.value;
});
$("rows").addEventListener("change", e => {
  const { id, k } = e.target.dataset;
  const r = id && byId(id);
  if (!r) return;
  if (k === "amount") {
    // Update in place (a full re-render isn't needed)
    e.target.value = fmtAmount(r.amount);
    e.target.closest("tr").classList.toggle("income", r.amount > 0);
  } else if (k === "date") {
    const parsed = parseDate(e.target.value);
    if (!parsed) {
      e.target.classList.add("invalid");
      $("status").textContent = `日期格式不对：「${e.target.value}」，应为 2026/10/29 22:12:00`;
      return;
    }
    Object.assign(r, parsed, { year_guessed: false }); // user has checked this date
    $("status").textContent = "";
    sortRecords();
    render();
  }
});
// Enter: same column, next row (Shift+Enter: previous row). Tab moves right natively.
$("rows").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing || !e.target.dataset.k) return; // isComposing: ignore Enter confirming IME input
  e.preventDefault();
  const tr = e.target.closest("tr");
  const row = e.shiftKey ? tr.previousElementSibling : tr.nextElementSibling;
  const next = row?.querySelector(`input[data-k="${e.target.dataset.k}"]`);
  if (next) next.focus();
  else e.target.dispatchEvent(new Event("change", { bubbles: true })); // last row: still apply the edit
});
// Select the whole cell when tabbing/clicking in, like a spreadsheet
$("rows").addEventListener("focusin", e => { if (e.target.dataset.k) e.target.select(); });
$("rows").addEventListener("click", e => {
  const id = e.target.dataset.del;
  if (id !== undefined) { records = records.filter(r => r.id !== +id); render(); }
});
function clearAll() {
  session++;
  records = [];
  for (const im of images) URL.revokeObjectURL(im.url);
  images = [];
  showImage(null);
  $("status").textContent = "";
  render();
}
$("clear").onclick = clearAll;

// Uploaded screenshots: thumbnails under the drop zone, click to view on the right
function renderThumbs() {
  $("thumbs").innerHTML = images.map(im =>
    `<div class="thumb">` +
    `<button class="thumb-open ${im.id === viewing ? "active" : ""}" data-img="${im.id}" title="${esc(im.name)}">` +
    `<img src="${im.url}" alt="${esc(im.name)}"></button>` +
    `<button class="thumb-del" data-img-del="${im.id}" title="删除这张截图（已识别的记录保留）" aria-label="删除截图">×</button>` +
    `</div>`).join("");
}
// Removes only the screenshot; rows already recognized from it stay in the table
function removeImage(id) {
  const im = images.find(i => i.id === id);
  if (!im) return;
  URL.revokeObjectURL(im.url);
  images = images.filter(i => i !== im);
  if (viewing === id) showImage(null);
  else renderThumbs();
}
function showImage(id) {
  const im = images.find(i => i.id === id);
  viewing = im ? id : null;
  document.body.classList.toggle("viewing", !!im);
  if (im) {
    $("viewer-img").src = im.url;
    $("viewer-img").alt = im.name;
    $("viewer-name").textContent = im.name;
    $("viewer").scrollTop = 0;
  }
  renderThumbs();
}
$("thumbs").addEventListener("click", e => {
  const del = +e.target.closest("[data-img-del]")?.dataset.imgDel;
  if (del) return removeImage(del);
  const id = +e.target.closest("[data-img]")?.dataset.img;
  if (id) showImage(id === viewing ? null : id); // clicking the open one closes it
});
$("viewer-close").onclick = () => showImage(null);
document.addEventListener("keydown", e => { if (e.key === "Escape" && viewing) showImage(null); });

$("export").onclick = () => {
  const cell = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = [["日期", "曜日", "账户", "币种", "金额", "种类", "描述"]].concat(records.map(r =>
    [r.date, r.weekday, r.account, r.currency, r.amount.toFixed(2), r.category, r.merchant]));
  const csv = "﻿" + lines.map(l => l.map(cell).join(",")).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const now = new Date(), p = n => String(n).padStart(2, "0");
  a.download = `txreader_${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
